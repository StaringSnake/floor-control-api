openapi: 3.0.0
info:
  title: Floor Control API
  description: An API for managing a "floor" in a push-to-talk radio group system.
  version: 1.0.0
servers:
  - url: http://localhost:4000
    description: Local dev server
paths:
  /:
    get:
      summary: Liveness check
      description: Confirms that the API process is running without checking dependencies.
      operationId: liveness
      responses:
        '200':
          description: The API process is running.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
              example:
                status: ok
  /ready:
    get:
      summary: Database readiness check
      description: Confirms that the API can reach its database.
      operationId: readiness
      responses:
        '200':
          description: The API and database are available.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
              example:
                status: ok
        '503':
          description: The database is unavailable.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - unavailable
              example:
                status: unavailable
  /groups/{groupId}/floor:
    get:
      summary: Look up the current Floor holder
      description: Returns the current holder for a group. A valid request always returns 200; the holder is null when the floor is unoccupied. IDs are trimmed, must be non-empty, and are limited to 255 characters. The acquiredAt value is an ISO 8601 UTC date-time with microsecond precision.
      operationId: currentFloorHolder
      tags: [Floor Control]
      parameters:
        - name: groupId
          in: path
          description: The trimmed, non-empty ID of the group.
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: group-alpha-123
      responses:
        '200':
          description: The current holder, or null when the floor is unoccupied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentHolderResponse'
              examples:
                occupied:
                  value:
                    holder:
                      userId: user-456
                      priority: 7
                      acquiredAt: '2026-08-01T12:00:00.000001Z'
                unoccupied:
                  value:
                    holder: null
        '400':
          description: Missing, blank, or invalid group identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The path is not found, including an omitted groupId path segment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Obtain the Floor (Push to Talk)
      description: Allows a user to request and obtain the floor for a specified radio group. IDs are trimmed, must be non-empty, and are limited to 255 characters. A request with strictly higher priority preempts the current holder atomically. Equal or lower priority requests conflict. An omitted path segment does not match this operation and returns the standard 404 response.
      operationId: obtainFloor
      tags: [Floor Control]
      parameters:
        - name: groupId
          in: path
          description: The trimmed, non-empty ID of the group.
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: group-alpha-123
      requestBody:
        description: User and optional priority requesting the floor.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: Successfully obtained the floor. Repeated obtains by the current holder are idempotent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Floor obtained by user-456 for group group-alpha-123
        '400':
          description: Missing, blank, or invalid identifier, priority, request body, or JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: userId must be a non-empty string
        '409':
          description: The floor is currently held by another user with equal or higher priority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                equalOrLowerPriority:
                  value:
                    message: Floor is currently held by user-789 for group group-alpha-123
        '404':
          description: The path is not found, including an omitted groupId path segment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /groups/{groupId}/floor/{userId}:
    delete:
      summary: Release the Floor
      description: Allows the specified current holder to release the floor. IDs are trimmed, must be non-empty, and are limited to 255 characters. An omitted path segment does not match this operation and returns the standard 404 response.
      operationId: releaseFloor
      tags: [Floor Control]
      parameters:
        - name: groupId
          in: path
          description: The trimmed, non-empty ID of the group.
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: group-alpha-123
        - name: userId
          in: path
          description: The trimmed, non-empty ID of the releasing user.
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: user-456
      responses:
        '200':
          description: Successfully released the floor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Floor released by user-456 for group group-alpha-123
        '400':
          description: Missing, blank, or whitespace-only identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: userId must be a non-empty string
        '403':
          description: The specified user does not hold the floor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: User user-456 does not hold the floor for group group-alpha-123
        '404':
          description: The path is not found, including an omitted groupId or userId path segment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /groups/{groupId}/floor/history:
    get:
      summary: List floor audit history
      description: >
        Returns append-only audit events for the group in deterministic
        chronological order (occurredAt ascending, then eventId ascending).
        pageSize defaults to 50 and must be an integer from 1 through 100.
        pageToken is an opaque URL-safe token returned by a previous response;
        it is scoped to this group by the query. New events appended while
        paging are excluded from the current walk by a snapshot high-water
        event ID. This guarantees stable history without duplicates or gaps;
        events appended after the first page are visible to a new walk, not
        the current walk. The token is opaque.
      operationId: floorHistory
      tags: [Floor Control]
      parameters:
        - name: groupId
          in: path
          required: true
          description: The trimmed, non-empty ID of the group.
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: group-alpha-123
        - name: pageSize
          in: query
          required: false
          description: Number of events to return. Defaults to 50; maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          example: 25
        - name: pageToken
          in: query
          required: false
          description: Opaque URL-safe continuation token from a previous response.
          schema:
            type: string
            maxLength: 2048
          example: eyJvY2N1cnJlZEF0IjoiMjAyNi0wOC0wMVQxMjowMDowMC4wMDAwMDFaIiwiaWQiOjUwLCJoaWdoV2F0ZXJFdmVudElkIjoxMDAsImdyb3VwSWQiOiJncm91cC1hbHBoYS0xMjMifQ
      responses:
        '200':
          description: A bounded page of audit history, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloorHistoryResponse'
              example:
                events:
                  - eventId: 1
                    groupId: group-alpha-123
                    userId: user-456
                    transition: acquired
                    priority: 7
                    counterparty: null
                    occurredAt: '2026-08-01T12:00:00.000001Z'
                    recordedAt: '2026-08-01T12:00:00.000002Z'
                nextPageToken: null
        '400':
          description: Missing, blank, or invalid groupId, pageSize, or pageToken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPageSize:
                  value:
                    message: pageSize must be an integer between 1 and 100
                invalidPageToken:
                  value:
                    message: pageToken is invalid
        '404':
          description: The path is not found, including an omitted groupId path segment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CurrentHolderResponse:
      type: object
      required: [holder]
      properties:
        holder:
          $ref: '#/components/schemas/Holder'
    Holder:
      type: object
      nullable: true
      required: [userId, priority, acquiredAt]
      properties:
        userId:
          type: string
        priority:
          type: integer
        acquiredAt:
          type: string
          format: date-time
          description: ISO 8601 UTC date-time with microsecond precision.
    UserRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 255
          description: The trimmed, non-empty user identifier.
          example: user-456
        priority:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: Request priority. Equal or lower priorities conflict with the current holder.
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    FloorHistoryResponse:
      type: object
      required: [events, nextPageToken]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/FloorHistoryEvent'
        nextPageToken:
          type: string
          nullable: true
          description: Opaque continuation token, or null when there are no more events.
    FloorHistoryEvent:
      type: object
      required:
        [eventId, groupId, userId, transition, priority, counterparty, occurredAt, recordedAt]
      properties:
        eventId:
          type: integer
          format: int64
        groupId:
          type: string
        userId:
          type: string
        transition:
          type: string
          enum: [acquired, released, timed_out, preempted]
        priority:
          type: integer
          minimum: 1
          maximum: 10
        counterparty:
          $ref: '#/components/schemas/Counterparty'
        occurredAt:
          type: string
          format: date-time
          description: ISO 8601 UTC date-time with microsecond precision.
        recordedAt:
          type: string
          format: date-time
          description: Inserted timestamp, as an ISO 8601 UTC date-time with microsecond precision.
    Counterparty:
      type: object
      nullable: true
      required: [userId, priority]
      properties:
        userId:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 10
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: A human-readable error message.
