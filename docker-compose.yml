services:
  db:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-floor_control_dev}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set; copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set; copy .env.example to .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-floor_control_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set; copy .env.example to .env}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE must be set; copy .env.example to .env and replace it}
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: ${PORT:-4000}
      POOL_SIZE: ${POOL_SIZE:-10}
      DATABASE_SSL: ${DATABASE_SSL:-false}
    ports:
      - "${PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:4000/ready || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
