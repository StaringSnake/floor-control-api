apiVersion: batch/v1
kind: Job
metadata:
  name: floor-control-migrate
  namespace: floor-control
  labels:
    app.kubernetes.io/name: floor-control-migrate
    app.kubernetes.io/part-of: floor-control
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: floor-control-migrate
        app.kubernetes.io/part-of: floor-control
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: floor-control-api:kind-local
          imagePullPolicy: Never
          command: ["/app/bin/floor_control", "eval", "FloorControl.Release.migrate()"]
          envFrom:
            - configMapRef:
                name: floor-control-config
            - secretRef:
                name: floor-control-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
