apiVersion: apps/v1
kind: Deployment
metadata:
  name: floor-control-api
  namespace: floor-control
  labels:
    app.kubernetes.io/name: floor-control-api
    app.kubernetes.io/part-of: floor-control
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: floor-control-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: floor-control-api
        app.kubernetes.io/part-of: floor-control
    spec:
      serviceAccountName: floor-control-api
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: floor-control-api:kind-local
          imagePullPolicy: Never
          command: ["/app/bin/floor_control", "start"]
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: floor-control-config
            - secretRef:
                name: floor-control-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
